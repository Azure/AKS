apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-gpu-model-blob
  labels:
    app.kubernetes.io/part-of: managed-gpu-inference-service
    aks.azure.com/example: managed-gpu-inference-service
provisioner: blob.csi.azure.com
parameters:
  protocol: nfs
  skuName: Premium_LRS
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - nconnect=4
  - noresvport
  - actimeo=120
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-weights
  namespace: managed-gpu-inference
  labels:
    app.kubernetes.io/part-of: managed-gpu-inference-service
    aks.azure.com/example: managed-gpu-inference-service
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: managed-gpu-model-blob
  resources:
    requests:
      storage: 200Gi
