apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm
  namespace: managed-gpu-inference
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: managed-gpu-inference-service
    aks.azure.com/example: managed-gpu-inference-service
    aks.azure.com/example: managed-gpu-inference-service
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: managed-gpu-inference
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: managed-gpu-inference-service
    aks.azure.com/example: managed-gpu-inference-service
spec:
  replicas: 2
  progressDeadlineSeconds: 3600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/part-of: managed-gpu-inference-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: vllm
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        agentpool: a100np
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vllm
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.28.0
          args:
            - /models/Qwen2.5-7B-Instruct
            - --served-model-name=qwen
            - --max-model-len=16384
            - --gpu-memory-utilization=0.90
            - --max-num-seqs=64
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "20"
              memory: 160Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-weights
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: managed-gpu-inference
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: managed-gpu-inference-service
    aks.azure.com/example: managed-gpu-inference-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vllm
  namespace: managed-gpu-inference
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: managed-gpu-inference-service
    aks.azure.com/example: managed-gpu-inference-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
