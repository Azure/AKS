# Autoscale queue for the AKS managed Kueue extension.
#
# Prerequisites:
#   - Managed Kueue installed and both controllers ready in kueue-system.
#   - An autoscaling CPU user pool named scalepool, initially with one node.
#   - Managed ResourceFlavor aks-cpu exists and AdmissionCheck
#     aks-provisioning-check is Active.
#
# The extension owns aks-cpu, aks-provisioning-check, and its
# aks-provisioning-config. This file only creates customer-owned queues and a
# demo namespace; it must not recreate or modify the managed defaults.
# The Job in 3-workloads/cas-batch-job pins its pods to agentpool=scalepool.
# That selector restricts provisioning to the target pool even though aks-cpu
# can represent multiple eligible CPU user pools.
#
# Apply from this directory:
#   kubectl apply -f 40-autoscale-queue.yaml
#
# Cleanup removes only this namespace and its LocalQueue, plus the ClusterQueue.
# Keep the managed defaults and the shared ProvisioningRequest API.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cas-kueue-demo
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cas-cluster-queue
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: aks-cpu
          resources:
            - name: cpu
              # Deliberately generous admission quota. The pool's max-count
              # and Azure capacity still bound what CAS can provision.
              nominalQuota: "100"
            - name: memory
              nominalQuota: 200Gi
  admissionChecksStrategy:
    admissionChecks:
      - name: aks-provisioning-check
        onFlavors: [aks-cpu]
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: cas-local-queue
  namespace: cas-kueue-demo
spec:
  clusterQueue: cas-cluster-queue
