# OPTIONAL customer-owned placement flavors for the managed Kueue/KubeRay example.
# Prefer existing AKS-managed ResourceFlavors with 15-managed-queue.yaml.tmpl.
# Apply this file only when those flavors don't meet your placement policy and
# you choose the custom 20/30 queue examples. It installs no controllers and
# never replaces or modifies generated aks-* flavors. The CPU autoscale demo
# uses aks-cpu directly and doesn't apply this file.
#
# Two flavors:
#   - default: matches any node (used for CPU-only pods like the Ray head)
#   - gpu:     targets GPU nodes via the AKS-managed accelerator label
#
# Apply once:
#   kubectl apply -f 10-resource-flavors.yaml
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu
spec:
  nodeLabels:
    accelerator: nvidia
