apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  namespace: default
  name: shared-gpu-claim 
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: gpu.amd.com
        allocationMode: ExactCount
        count: 1
---
apiVersion: batch/v1
kind: Job
metadata:
  namespace: default
  name: job1 # First job to use the shared GPU
spec:
  template:
    metadata:
      labels:
        app: job-shared-gpu
    spec:
      restartPolicy: Never
      containers:
      - name: ctr0
        image: docker.io/rocm/pytorch:latest
        command: ["bash", "-c"]
        args: ["echo '--- Job 1 ---'; /opt/venv/bin/amd-smi list; echo 'Job 1 complete.'"]
        resources:
          claims:
          - name: gpu # This name must match the name in the `resourceClaims` list below
      resourceClaims:
      - name: gpu
        # Reference the explicitly created ResourceClaim, not a template
        resourceClaimName: shared-gpu-claim

---
apiVersion: batch/v1
kind: Job
metadata:
  namespace: default
  name: job2 # Second job to use the same shared GPU
spec:
  template:
    metadata:
      labels:
        app: job-shared-gpu
    spec:
      restartPolicy: Never
      containers:
      - name: ctr0
        image: docker.io/rocm/pytorch:latest
        command: ["bash", "-c"]
        args: ["echo '--- Job 2 ---'; /opt/venv/bin/amd-smi list; echo 'Job 2 complete.'"]
        resources:
          claims:
          - name: gpu
      resourceClaims:
      - name: gpu
        # Reference the same explicit ResourceClaim
        resourceClaimName: shared-gpu-claim