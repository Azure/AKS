apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels: { name: nvidia-device-plugin-ds }
  template:
    metadata:
      labels: { name: nvidia-device-plugin-ds }
    spec:
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
        - { key: sku, operator: Equal, value: gpu, effect: NoSchedule }
      priorityClassName: system-node-critical
      # Run only on the managed-driver pools (Examples 1 and 2). Example 3's
      # driverpool gets its device plugin from the NVIDIA GPU Operator, so this
      # standalone plugin must NOT also target it — two plugins competing for the
      # same GPU on one node makes the pod crash-loop. Scope by agent pool name.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.azure.com/accelerator, operator: In, values: [nvidia] }
                  - { key: agentpool, operator: In, values: [imgpool, modelpool] }
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.1
          # privileged + the kubelet device-plugins hostPath are the standard,
          # required setup for any Kubernetes device plugin (it registers the
          # GPU with kubelet over that socket); they are not app-specific risk.
          securityContext:
            privileged: true
          # Keep the default FAIL_ON_INIT_ERROR=true: if the plugin ever starts
          # before the GPU runtime is ready, the container exits and kubelet
          # restarts it (retrying until the GPU is up). Setting it false would
          # leave the pod running but wedged, never advertising nvidia.com/gpu.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { name: device-plugin, mountPath: /var/lib/kubelet/device-plugins }
      volumes:
        - name: device-plugin
          hostPath: { path: /var/lib/kubelet/device-plugins }
