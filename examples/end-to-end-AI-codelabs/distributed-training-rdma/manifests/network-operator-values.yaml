# Network Operator deploys NFD; the codelab supplies the Azure Mellanox rule.
nfd:
  deployNodeFeatureRules: false

# Preserve the chart's control-plane tolerations and explicitly tolerate the
# nvidia.com/gpu=present:NoSchedule taint used by the codelab pool.
node-feature-discovery:
  worker:
    tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
