apiVersion: v1
kind: Namespace
metadata:
  name: gpu-inference
  labels:
    aks-codelab: kueue-gpu-inference-autoscaling
    app.kubernetes.io/part-of: kueue-gpu-inference-codelab
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-inference
  labels:
    aks-codelab: kueue-gpu-inference-autoscaling
spec:
  nodeLabels:
    agentpool: gpupool
  tolerations:
    - key: sku
      operator: Equal
      value: gpu
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ProvisioningRequestConfig
metadata:
  name: gpu-inference
  labels:
    aks-codelab: kueue-gpu-inference-autoscaling
spec:
  provisioningClassName: best-effort-atomic-scale-up.autoscaling.x-k8s.io
  managedResources:
    - nvidia.com/gpu
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: gpu-inference-provisioning
  labels:
    aks-codelab: kueue-gpu-inference-autoscaling
spec:
  controllerName: kueue.x-k8s.io/provisioning-request
  parameters:
    apiGroup: kueue.x-k8s.io
    kind: ProvisioningRequestConfig
    name: gpu-inference
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-inference-cluster-queue
  labels:
    aks-codelab: kueue-gpu-inference-autoscaling
spec:
  namespaceSelector:
    matchLabels:
      app.kubernetes.io/part-of: kueue-gpu-inference-codelab
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: gpu-inference
          resources:
            - name: cpu
              nominalQuota: "12"
            - name: memory
              nominalQuota: 48Gi
            - name: nvidia.com/gpu
              nominalQuota: "3"
  admissionChecksStrategy:
    admissionChecks:
      - name: gpu-inference-provisioning
        onFlavors:
          - gpu-inference
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gpu-inference
  namespace: gpu-inference
  labels:
    aks-codelab: kueue-gpu-inference-autoscaling
spec:
  clusterQueue: gpu-inference-cluster-queue
