apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: localdns-corefile-rollback
  namespace: kube-system
  labels:
    app: localdns-corefile-rollback
spec:
  selector:
    matchLabels:
      app: localdns-corefile-rollback
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: localdns-corefile-rollback
    spec:
      # The container needs hostPID plus nsenter so systemctl commands run in the node's namespaces,
      # not only inside the container.
      hostPID: true
      # Uncomment to target one node pool first.
      # nodeSelector:
      #   agentpool: default
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      containers:
      - name: localdns-corefile-rollback
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        # Keep reconciling so regenerated files are restored while the rollback DaemonSet is present.
        - name: RECONCILE_INTERVAL_SECONDS
          value: "60"
        command:
        - nsenter
        - --target
        - "1"
        - --mount
        - --uts
        - --ipc
        - --net
        - --pid
        - --
        - sh
        - -c
        - |
          # Exit on unset variables and failed commands so partial rollback does not look successful.
          set -eu

          # Rollback restores the same node-local files that the patch DaemonSet changed.
          # These paths are on the host because the container is running through nsenter.

          # localdns.service reads persisted Corefile payloads from this environment file.
          ENV_FILE="/etc/localdns/environment"
          # AgentBaker installs the LocalDNS CoreDNS binary, script, and Corefiles under this directory.
          LOCALDNS_DIR="/opt/azure/containers/localdns"
          # localdns.sh regenerates this base Corefile from /etc/localdns/environment on startup.
          LOCALDNS_CORE_FILE="${LOCALDNS_DIR}/localdns.corefile"
          # localdns.sh starts CoreDNS with this post-processed Corefile.
          UPDATED_LOCALDNS_CORE_FILE="${LOCALDNS_DIR}/updated.localdns.corefile"
          # Reconcile functions set this when they restore any file.
          CHANGED=0

          require_backup() {
              file="$1"
              backup="${file}.pre-localdns-patch"

              if [ ! -f "$backup" ]; then
                  echo "Rollback backup is missing: $backup"
                  return 1
              fi
          }

          # Restore one file from the backup created by the patch DaemonSet.
          # All expected backups are required before rollback starts, so rollback cannot partially restore a node.
          restore_backup_if_present() {
              file="$1"
              backup="${file}.pre-localdns-patch"

              # If the current file already equals the backup, keep the pass idempotent.
              if cmp -s "$file" "$backup"; then
                  echo "$file already matches rollback backup"
                  return 0
              fi

              # Restore the exact pre-patch content, including removing reload 10s if the patch added it.
              cp "$backup" "$file"
              chmod 0644 "$file"
              CHANGED=1
              echo "Restored $file from $backup"
          }

          # Verify the running rollback target file no longer contains any directives added by the patch.
          # This intentionally checks updated.localdns.corefile because localdns runs CoreDNS with this file.
          verify_rollback() {
              for file in "$ENV_FILE" "$LOCALDNS_CORE_FILE" "$UPDATED_LOCALDNS_CORE_FILE"; do
                  if [ ! -f "$file" ]; then
                      echo "Rollback verification failed: $file is missing"
                      return 1
                  fi
                  if ! cmp -s "$file" "${file}.pre-localdns-patch"; then
                      echo "Rollback verification failed: $file does not match ${file}.pre-localdns-patch"
                      return 1
                  fi
              done

              if grep -nE "reload 10s|prefer_udp|health_check 5s|failfast_all_unhealthy_upstreams" "$UPDATED_LOCALDNS_CORE_FILE"; then
                  echo "Rollback verification failed: patch directives still exist in $UPDATED_LOCALDNS_CORE_FILE"
                  return 1
              fi

              echo "Rollback verification passed: files match backups and patch directives are absent from $UPDATED_LOCALDNS_CORE_FILE"
          }

          # Run one rollback reconciliation pass:
          # 0. Require all three backups to avoid partial rollback.
          # 1. Restore the three backup files.
          # 2. Restart localdns whenever files were restored.
          # 3. Verify all restored files match their backups and patch directives are absent.
          reconcile_once() {
              CHANGED=0

              require_backup "$ENV_FILE"
              require_backup "$LOCALDNS_CORE_FILE"
              require_backup "$UPDATED_LOCALDNS_CORE_FILE"

              # Restore persisted payloads first so future localdns restarts do not regenerate patched Corefiles.
              restore_backup_if_present "$ENV_FILE"
              # Restore the decoded Corefile and the Corefile currently used by the running service.
              restore_backup_if_present "$LOCALDNS_CORE_FILE"
              restore_backup_if_present "$UPDATED_LOCALDNS_CORE_FILE"

              if [ "$CHANGED" -eq 1 ]; then
                  # Restart whenever rollback restored files because the restored Corefile may not contain reload 10s.
                  echo "Restored LocalDNS files; restarting localdns"
                  systemctl restart localdns
                  systemctl is-active localdns
                  verify_rollback
              else
                  echo "LocalDNS files already match rollback backups"
                  verify_rollback
              fi
          }

          # Keep the rollback DaemonSet alive and restore files if something rewrites them.
          # Delete this DaemonSet after rollback is verified.
          while true; do
              reconcile_once
              sleep "${RECONCILE_INTERVAL_SECONDS:-60}"
          done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
