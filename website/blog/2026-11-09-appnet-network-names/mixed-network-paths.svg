<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">One Application Network, one target, two cross-cluster paths</title>
  <desc id="desc">Clusters A and B share the network name corp-routable with non-overlapping, bidirectionally routable pod ranges. A reaches B's target workload through the direct ambient data plane. Cluster C uses isolated-c and reuses B's pod range. C reaches the same target through B's east-west gateway at a separately reachable underlay address. Network names describe these paths but do not establish routes. Only B's receiving gateway is shown.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .heading { font-size: 32px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 19px; fill: #43546c; }
      .direct { fill: #155fa0; }
      .gateway { fill: #93420d; }
    </style>
    <marker id="direct-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#155fa0"/>
    </marker>
    <marker id="gateway-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#93420d"/>
    </marker>
  </defs>
  <rect width="1200" height="800" rx="20" fill="#f5f8fc"/>
  <text x="40" y="52" class="heading">One target. Two network paths.</text>
  <text x="40" y="88" class="body">The source and destination network identities determine the cross-cluster path.</text>

  <rect x="24" y="112" width="1152" height="630" rx="18" fill="#ffffff" stroke="#6974bd" stroke-width="2"/>
  <text x="48" y="148" class="label">One Azure Kubernetes Application Network</text>

  <rect x="50" y="166" width="1100" height="330" rx="14" fill="#edf5ff" stroke="#3283b4" stroke-width="2"/>
  <text x="76" y="205" class="label">Network name: corp-routable</text>
  <text x="76" y="237" class="small">Non-overlapping pod ranges with direct, bidirectional reachability</text>

  <rect x="80" y="260" width="360" height="100" rx="12" fill="#ffffff" stroke="#50677c" stroke-width="2"/>
  <text x="102" y="293" class="label">Cluster A</text>
  <text x="102" y="324" class="body">Pod CIDR: 10.10.0.0/16</text>
  <text x="102" y="349" class="small">Source workload</text>

  <rect x="800" y="260" width="310" height="100" rx="12" fill="#ffffff" stroke="#50677c" stroke-width="2"/>
  <text x="820" y="292" class="label">Cluster B: target</text>
  <text x="820" y="321" class="body">Pod CIDR: 10.20.0.0/16</text>
  <text x="820" y="348" class="small">Target pod: 10.20.0.20</text>

  <path d="M440 312 H796" fill="none" stroke="#155fa0" stroke-width="4" marker-end="url(#direct-arrow)"/>
  <text x="620" y="285" class="body direct" text-anchor="middle">Same name: direct ambient path</text>

  <rect x="800" y="392" width="310" height="78" rx="12" fill="#fff5e8" stroke="#93420d" stroke-width="2"/>
  <text x="820" y="422" class="body">B's east-west gateway</text>
  <text x="820" y="450" class="small">Reachable endpoint: 172.18.2.10</text>
  <path d="M955 392 V364" fill="none" stroke="#93420d" stroke-width="4" marker-end="url(#gateway-arrow)"/>

  <rect x="50" y="520" width="420" height="170" rx="14" fill="#fff8ed" stroke="#93420d" stroke-width="2"/>
  <text x="76" y="554" class="label">Network name: isolated-c</text>
  <rect x="80" y="574" width="362" height="98" rx="12" fill="#ffffff" stroke="#50677c" stroke-width="2"/>
  <text x="102" y="606" class="label">Cluster C</text>
  <text x="102" y="635" class="body">Pod CIDR: 10.20.0.0/16</text>
  <text x="102" y="660" class="small">Reuses B's pod address space</text>

  <path d="M442 624 H645 V431 H796" fill="none" stroke="#93420d" stroke-width="4" marker-end="url(#gateway-arrow)"/>
  <text x="668" y="655" class="body gateway" text-anchor="middle">Different name: gateway path</text>
  <text x="48" y="718" class="small">Only B's receiving gateway is shown. Direct traffic still uses the ambient data plane.</text>
  <text x="40" y="779" class="body" font-weight="700">Gateway reachability is a prerequisite. Network names don't create routes.</text>
</svg>
