name: Kueue and Ray example contracts

on:
  pull_request:
    paths:
      - examples/kueue-and-ray-on-aks/**
      - .github/workflows/kueue-ray-examples.yml
  push:
    paths:
      - examples/kueue-and-ray-on-aks/**
      - .github/workflows/kueue-ray-examples.yml

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: examples/kueue-and-ray-on-aks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install offline test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext-base
          python -m pip install -r 2-kueue-queues/tests/requirements.txt
      - name: Check shell syntax
        run: find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check managed installation safety
        run: python -m unittest discover -s 1-infrastructure/managed/tests -v
      - name: Check managed Kueue contracts
        run: python -m unittest discover -s 2-kueue-queues/tests -v
      - name: Check Ray submitters without a cluster
        run: python -m unittest discover -s 3-workloads/tests -v
